<svg xmlns="http://www.w3.org/2000/svg" width="352" height="328" style="background:#1e1e1e;">
  <style>
    .term { font-family: 'Cascadia Code', 'Fira Code', 'Consolas', 'Monospace'; font-size: 13px; fill: #d4d4d4; white-space: pre; }
    .prompt { fill: #00ff00; }
    .header { fill: #569cd6; }
    .error { fill: #f44747; }
    .success { fill: #4ec9b0; }
  </style>
  <rect width="100%" height="100%" fill="#1e1e1e"/>
  <text x="20" y="33" class="term"></text>
  <text x="20" y="51" class="term header">========================================</text>
  <text x="20" y="69" class="term header">        STUDENT DATA BASE SYSTEM</text>
  <text x="20" y="87" class="term header">========================================</text>
  <text x="20" y="105" class="term">1. Add student manually</text>
  <text x="20" y="123" class="term">2. Add students from file</text>
  <text x="20" y="141" class="term">3. Find number of students</text>
  <text x="20" y="159" class="term">4. Find student by roll number</text>
  <text x="20" y="177" class="term">5. Find student by first name</text>
  <text x="20" y="195" class="term">6. Find students by course</text>
  <text x="20" y="213" class="term">7. Delete student</text>
  <text x="20" y="231" class="term">8. Update student</text>
  <text x="20" y="249" class="term">9. Exit</text>
  <text x="20" y="267" class="term header">========================================</text>
  <text x="20" y="285" class="term prompt">Enter your choice: 9</text>
  <text x="20" y="303" class="term">Exiting the program...</text>
</svg>