<svg xmlns="http://www.w3.org/2000/svg" width="391" height="184" style="background:#1e1e1e;">
  <style>
    .term { font-family: 'Cascadia Code', 'Fira Code', 'Consolas', 'Monospace'; font-size: 13px; fill: #d4d4d4; white-space: pre; }
    .prompt { fill: #00ff00; }
    .header { fill: #569cd6; }
    .error { fill: #f44747; }
    .success { fill: #4ec9b0; }
  </style>
  <rect width="100%" height="100%" fill="#1e1e1e"/>
  <text x="20" y="33" class="term">---------- Delete Student ----------</text>
  <text x="20" y="51" class="term prompt">Enter roll number for student to be deleted: </text>
  <text x="20" y="69" class="term">1001</text>
  <text x="20" y="87" class="term success">Student has been deleted properly.</text>
  <text x="20" y="105" class="term">Registered student = 16</text>
  <text x="20" y="123" class="term">Remaining places   = 34</text>
  <text x="20" y="141" class="term"></text>
  <text x="20" y="159" class="term">Press Enter to continue...</text>
</svg>